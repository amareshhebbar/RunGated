name: rungated

x-rungated-build: &rungated-build
  context: ../..
  dockerfile: deploy/docker/Dockerfile
  target: runtime

x-rungated-common: &rungated-common
  build: *rungated-build
  image: rungated:local
  ports:
    - "${RUNGATED_PORT:-8080}:8080"
    - "${RUNGATED_EGRESS_PORT:-8081}:8081"
  volumes:
    - ./manifests:/etc/rungated/manifests:ro
  environment:
    RUNGATED_OPENAI_BASE_URL: http://mock-llm:9300/v1
    OPENAI_API_KEY: demo

services:
  rungated:
    <<: *rungated-common
    profiles: ["default"]
    command: ["serve", "--dev", "--config", "/etc/rungated/rungated.yaml", "--manifests", "/etc/rungated/manifests"]
    volumes:
      - ./config/rungated.yaml:/etc/rungated/rungated.yaml:ro
      - ./manifests:/etc/rungated/manifests:ro
      - rungated-data:/data
    depends_on:
      - mock-llm
      - poisoned-mcp
      - evil-web

  rungated-full:
    <<: *rungated-common
    profiles: ["full"]
    command: ["serve", "--dev", "--config", "/etc/rungated/rungated.yaml", "--manifests", "/etc/rungated/manifests"]
    volumes:
      - ./config/rungated-full.yaml:/etc/rungated/rungated.yaml:ro
      - ./manifests:/etc/rungated/manifests:ro
      - rungated-full-data:/data
    depends_on:
      mock-llm:
        condition: service_started
      poisoned-mcp:
        condition: service_started
      evil-web:
        condition: service_started
      postgres:
        condition: service_healthy

  mock-llm:
    build: *rungated-build
    image: rungated:local
    profiles: ["default", "full"]
    command: ["demo", "mock-llm", "--listen", "0.0.0.0:9300"]

  poisoned-mcp:
    build: *rungated-build
    image: rungated:local
    profiles: ["default", "full"]
    command: ["demo", "poisoned-mcp", "--listen", "0.0.0.0:9301"]

  evil-web:
    build: *rungated-build
    image: rungated:local
    profiles: ["default", "full"]
    command: ["demo", "evil-web", "--listen", "0.0.0.0:9302"]

  run-attacks:
    build:
      context: ../..
      dockerfile: demo/Dockerfile
    profiles: ["attack"]
    restart: "no"
    environment:
      DEMO_GATEWAY: http://rungated:8080
      DEMO_EGRESS: http://rungated:8081
      DEMO_MOCK_LLM: http://mock-llm:9300
      DEMO_MCP: http://poisoned-mcp:9301
      DEMO_WEB: http://evil-web:9302

  postgres:
    image: postgres:16-alpine
    profiles: ["full"]
    environment:
      POSTGRES_USER: rungated
      POSTGRES_PASSWORD: rungated
      POSTGRES_DB: rungated
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rungated"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  rungated-data:
  rungated-full-data:
  postgres-data:
