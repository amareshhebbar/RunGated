{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "rungated.fullname" . }}
  labels:
    {{- include "rungated.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "rungated.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      {{- $secret := .Values.monitoring.serviceMonitor.secretName | default .Values.secrets.existingSecret | default (include "rungated.fullname" .) }}
      authorization:
        type: Bearer
        credentials:
          name: {{ $secret }}
          key: {{ .Values.monitoring.serviceMonitor.secretKey }}
{{- end }}