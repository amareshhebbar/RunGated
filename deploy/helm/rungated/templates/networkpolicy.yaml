{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rungated.fullname" . }}
  labels:
    {{- include "rungated.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rungated.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.allowedPodLabels | nindent 14 }}
        {{- if .Values.networkPolicy.allowedNamespaceLabels }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.allowedNamespaceLabels | nindent 14 }}
        {{- end }}
      ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
{{- end }}
