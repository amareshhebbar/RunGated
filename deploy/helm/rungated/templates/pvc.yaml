{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) (eq .Values.config.store.kind "embedded") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rungated.fullname" . }}
  labels:
    {{- include "rungated.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
