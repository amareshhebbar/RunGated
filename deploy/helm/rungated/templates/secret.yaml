{{- if include "rungated.hasChartSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rungated.fullname" . }}
  labels:
    {{- include "rungated.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.apiKey }}
  RUNGATED_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.masterKey }}
  RUNGATED_MASTER_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.databaseUrl }}
  RUNGATED_DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.slackBotToken }}
  RUNGATED_SLACK_BOT_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.slackSigningSecret }}
  RUNGATED_SLACK_SIGNING_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.clickhousePassword }}
  RUNGATED_CLICKHOUSE_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
