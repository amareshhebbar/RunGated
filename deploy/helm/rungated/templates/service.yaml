apiVersion: v1
kind: Service
metadata:
  name: {{ include "rungated.fullname" . }}
  labels:
    {{- include "rungated.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: egress
      port: {{ .Values.service.egressPort }}
      targetPort: egress
      protocol: TCP
  selector:
    {{- include "rungated.selectorLabels" . | nindent 4 }}
